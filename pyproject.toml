[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyTerrainModeler"
version = "1.0.0"
authors = [
  { name="Unintelligible Maker", email="maker@unintelligiblemaker.com" },
]
description = "A tool for generating 3D-printable STL files from terrain elevation data"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "geopy",
    "numpy-stl",
    "numpy",
]

[project.urls]
"Homepage" = "https://github.com/UnintelligibleMaker/PyTerrainModeler"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyterrainmodeler*"]
